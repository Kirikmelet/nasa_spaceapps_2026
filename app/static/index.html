<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Astronaut Health Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-bg text-white min-h-screen p-6 md:p-10">

  <div class="max-w-6xl mx-auto">
    <!-- Dashboard Header -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-end mb-8 pb-4 border-b border-white/10">
      <div>
        <p class="text-xs uppercase tracking-widest text-sky-400 font-semibold mb-1">NASA-STD-3001 Telemetry</p>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Crew Health Summary</h1>
      </div>
      <div class="mt-3 md:mt-0 flex items-center gap-2 text-xs text-zinc-400 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Live Stream (3s Interval)</span>
      </div>
    </header>

    <main class="space-y-10">
      <!-- 1. Alerts Section (Moved to the top!) -->
      <section id="alerts-section"
               hx-get="/partials/alerts"
               hx-trigger="load, every 3s"
               hx-swap="innerHTML">
        <div class="metric-card p-6 text-zinc-400 text-sm">Loading health alerts...</div>
      </section>

      <!-- 2. Vitals Section (Now below Alerts) -->
      <section id="vitals-section"
               hx-get="/partials/vitals"
               hx-trigger="load, every 3s"
               hx-swap="innerHTML">
        <div class="metric-card p-6 text-zinc-400 text-sm">Loading vital signs telemetry...</div>
      </section>
    </main>
  </div>

</body>
</html>
