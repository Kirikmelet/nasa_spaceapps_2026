<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Astronaut Health Dashboard</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Load Idiomorph extension for smooth, flicker-free DOM morphing -->
  <script src="https://unpkg.com/idiomorph@0.3.0/dist/idiomorph-ext.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load Chart.js for interactive line charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body hx-ext="morph" class="dashboard-bg text-white min-h-screen p-6 md:p-10">

  <div class="max-w-6xl mx-auto">
    <!-- Dashboard Header -->
    <header class="flex flex-col md:flex-row md:justify-between md:items-end mb-8 pb-4 border-b border-white/10">
      <div>
        <p class="text-xs uppercase tracking-widest text-sky-400 font-semibold mb-1">NASA-STD-3001 Telemetry</p>
        <h1 class="text-3xl md:text-4xl font-bold tracking-tight">Crew Health Summary</h1>
      </div>
      <div class="mt-3 md:mt-0 flex items-center gap-2 text-xs text-zinc-400 bg-white/5 px-3 py-1.5 rounded-full border border-white/10">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
        <span>Live Stream (3s Interval)</span>
      </div>
    </header>

    <main class="space-y-10">
      <!-- 1. Alerts Section -->
      <section id="alerts-section"
               hx-get="/partials/alerts"
               hx-trigger="load, every 3s"
               hx-swap="morph:innerHTML">
        <div class="metric-card p-6 text-zinc-400 text-sm">Loading health alerts...</div>
      </section>

      <!-- 2. Vitals Section -->
      <section id="vitals-section"
               hx-get="/partials/vitals"
               hx-trigger="load, every 3s"
               hx-swap="morph:innerHTML">
        <div class="metric-card p-6 text-zinc-400 text-sm">Loading vital signs telemetry...</div>
      </section>
    </main>
  </div>

  <!-- Metric Detail Modal (Line Chart on Top + History Log Below) -->
  <div id="metric-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="metric-card w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden border border-white/15 shadow-2xl">
      
      <!-- Modal Header -->
      <div class="flex justify-between items-center p-6 border-b border-white/10">
        <div>
          <p id="modal-subtitle" class="text-xs uppercase tracking-wider text-zinc-400 font-semibold"></p>
          <h2 id="modal-title" class="text-2xl font-bold text-white mt-0.5">Metric History</h2>
        </div>
        <div class="flex items-center gap-4">
          <!-- Legend for Red / Yellow / Green points -->
          <div class="hidden sm:flex items-center gap-3 text-xs text-zinc-300 bg-white/5 px-3 py-1.5 rounded-full">
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-emerald-400"></span>Healthy</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>Warning</span>
            <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>Critical</span>
          </div>
          <button onclick="closeMetricModal()" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-zinc-300 hover:text-white transition">
            ✕
          </button>
        </div>
      </div>

      <!-- Modal Body: Line Chart (Top) + History Table (Bottom) -->
      <div class="p-6 overflow-y-auto space-y-6">
        
        <!-- TOP: Line Chart Container -->
        <div class="bg-black/40 p-4 rounded-2xl border border-white/5">
          <div class="h-64 w-full relative">
            <canvas id="historyChart"></canvas>
          </div>
        </div>

        <!-- BOTTOM: Historical Records List -->
        <div>
          <h3 class="text-sm font-semibold text-zinc-300 mb-3 px-1">Historical Telemetry Log (Newest First)</h3>
          <div class="overflow-hidden rounded-2xl border border-white/10 bg-black/30">
            <table class="w-full text-left border-collapse text-sm">
              <thead>
                <tr class="border-b border-white/10 text-xs uppercase text-zinc-400 bg-white/5">
                  <th class="py-3 px-4">Time</th>
                  <th class="py-3 px-4">Activity</th>
                  <th class="py-3 px-4">Value</th>
                  <th class="py-3 px-4">Status</th>
                </tr>
              </thead>
              <tbody id="history-table-body" class="divide-y divide-white/5 text-zinc-200">
                <!-- Populated dynamically via JS -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
// ---------- helpers ----------
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));

async function api(url, options) {
  const res = await fetch(url, options);
  if (!res.ok) throw new Error(`${options?.method || 'GET'} ${url} -> ${res.status}`);
  return res.json();
}

// ---------- alerts panel collapse state ----------
window.alertsExpanded = false;

function applyAlertsCollapseState() {
  const list = document.getElementById('alerts-list');
  const text = document.getElementById('alerts-toggle-text');
  const icon = document.getElementById('alerts-toggle-icon');
  if (!list) return;

  list.classList.toggle('hidden', !window.alertsExpanded);
  if (text) text.textContent = window.alertsExpanded ? 'Click to collapse' : 'Click to expand';
  if (icon) icon.style.transform = window.alertsExpanded ? 'rotate(180deg)' : 'rotate(0deg)';
}

function toggleAlertsPanel() {
  window.alertsExpanded = !window.alertsExpanded;
  applyAlertsCollapseState();
}

// Re-apply after every HTMX refresh so the 3s poll never resets it
document.body.addEventListener('htmx:afterSwap', (evt) => {
  if (evt.detail.target?.id === 'alerts-section') applyAlertsCollapseState();
});

// ---------- acknowledge ----------
async function acknowledgeAlertGroup(astronautId, metric, primaryAlertId, btnEl) {
  // Optimistic UI: remove the card right away
  btnEl.closest('.metric-card')?.remove();

  const list = document.getElementById('alerts-list');
  if (list) {
    const remaining = list.children.length;
    if (remaining === 0) {
      window.alertsExpanded = false;
      const container = document.getElementById('alerts-container');
      if (container) {
        container.innerHTML = `
          <h2 class="text-lg font-semibold text-zinc-200 px-2 flex items-center gap-2">
            <span>🔔</span> Active Health Alerts
          </h2>
          <div id="alerts-empty" class="metric-card p-5 flex items-center gap-3 text-emerald-400 text-sm">
            <span>✅</span>
            <span>All crew vital signs are within nominal parameters. No active alerts.</span>
          </div>`;
      }
    } else {
      const badge = document.querySelector('#alerts-summary-bar span.rounded-full');
      if (badge) badge.textContent = `${remaining} Active Alert${remaining > 1 ? 's' : ''}`;
    }
  }

  try {
    await api(`/alerts/${primaryAlertId}/acknowledge`, { method: 'POST' });

    // Clear duplicates for the same astronaut + metric.
    // The server returns only the newest revision of each alert, so
    // "!acknowledged" is reliable here. Scoped to one astronaut, not all alerts.
    const alerts = await api(`/astronauts/${encodeURIComponent(astronautId)}/alerts?limit=300`);
    const duplicates = alerts.filter(a => !a.acknowledged && a.metric === metric);
    await Promise.all(
      duplicates.map(a => api(`/alerts/${a.id}/acknowledge`, { method: 'POST' }))
    );
  } catch (err) {
    // The card was removed optimistically; the next 3s poll restores it if the server disagrees
    console.error('Failed to acknowledge alert:', err);
  }
}

// ---------- threshold rules (match app/alert_engine.py) ----------
// [critLow, warnLow, warnHigh, critHigh]
const DEFAULT_LIMITS = {
  spo2:   [90, 94, null, null],
  temp:   [35.0, 35.5, 37.8, 39.0],
  bp_sys: [80, 90, 140, 180],
  bp_dia: [50, 60, 90, 120],
  resp:   [8, 10, 20, 30],
};
const HR_LIMITS = {
  rest:     [40, 50, 100, 130],
  sleep:    [35, 45, 90, 110],
  exercise: [40, 50, 170, 190],
  eva:      [40, 50, 160, 185],
};

const STATUS = {
  Healthy:  { level: 'Healthy',  color: '#34d399', badge: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
  Warning:  { level: 'Warning',  color: '#fbbf24', badge: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
  Critical: { level: 'Critical', color: '#f43f5e', badge: 'bg-rose-500/20 text-rose-300 border-rose-500/30' },
};

// "exercise_treadmill" -> "exercise", "eva_maintenance" -> "eva", unknown -> "rest"
function normalizeActivity(activity) {
  const a = String(activity || '').toLowerCase();
  return Object.keys(HR_LIMITS).find(k => a === k || a.startsWith(k)) || 'rest';
}

function evaluateStatus(metric, value, activity) {
  const lims = metric === 'hr'
    ? HR_LIMITS[normalizeActivity(activity)]
    : DEFAULT_LIMITS[metric];
  if (!lims || !Number.isFinite(value)) return STATUS.Healthy;

  const [critLo, warnLo, warnHi, critHi] = lims;
  if ((critLo !== null && value < critLo) || (critHi !== null && value > critHi)) return STATUS.Critical;
  if ((warnLo !== null && value < warnLo) || (warnHi !== null && value > warnHi)) return STATUS.Warning;
  return STATUS.Healthy;
}

// ---------- metric modal ----------
let chartInstance = null;
let activeModalParams = null;
let modalRefreshTimer = null;
let requestSeq = 0; // ignores stale responses after switching metric or closing

async function openMetricModal(astronautId, metricKey, metricLabel, unit) {
  // Always start fresh so a previous metric's label/data never leaks through
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  if (modalRefreshTimer) clearInterval(modalRefreshTimer);

  activeModalParams = { astronautId, metricKey, metricLabel, unit };
  document.getElementById('modal-subtitle').textContent = `${astronautId} · Real-Time Telemetry History`;
  document.getElementById('modal-title').textContent = `${metricLabel} (${unit})`;
  document.getElementById('history-table-body').innerHTML = '';
  document.getElementById('metric-modal').classList.remove('hidden');

  await fetchAndRenderHistory();
  modalRefreshTimer = setInterval(fetchAndRenderHistory, 3000);
}

function closeMetricModal() {
  document.getElementById('metric-modal').classList.add('hidden');
  if (modalRefreshTimer) { clearInterval(modalRefreshTimer); modalRefreshTimer = null; }
  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
  activeModalParams = null;
  requestSeq++; // invalidate any in-flight fetch
}

// Close with Esc or by clicking the dark backdrop
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && activeModalParams) closeMetricModal(); });
document.getElementById('metric-modal').addEventListener('click', (e) => {
  if (e.target.id === 'metric-modal') closeMetricModal();
});

async function fetchAndRenderHistory() {
  if (!activeModalParams) return;
  const { astronautId, metricKey, metricLabel, unit } = activeModalParams;
  const seq = ++requestSeq;

  try {
    const data = await api(`/astronauts/${encodeURIComponent(astronautId)}/vitals?limit=50`);
    if (seq !== requestSeq || !activeModalParams) return; // stale response, drop it

    const labels = [];
    const values = [];
    const pointColors = [];
    for (const r of data) {
      const val = Number(r[metricKey]);
      labels.push(new Date(r.timestamp).toLocaleTimeString());
      values.push(val);
      pointColors.push(evaluateStatus(metricKey, val, r.activity).color);
    }

    // 1. Line chart (top)
    if (chartInstance) {
      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = values;
      chartInstance.data.datasets[0].pointBackgroundColor = pointColors;
      chartInstance.data.datasets[0].pointBorderColor = pointColors;
      chartInstance.update('none');
    } else {
      const ctx = document.getElementById('historyChart').getContext('2d');
      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: `${metricLabel} (${unit})`,
            data: values,
            borderColor: 'rgba(255, 255, 255, 0.25)',
            borderWidth: 2,
            tension: 0.3,
            pointBackgroundColor: pointColors,
            pointBorderColor: pointColors,
            pointRadius: 6,
            pointHoverRadius: 8,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#71717a', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,0.05)' } },
            y: { ticks: { color: '#a1a1aa' }, grid: { color: 'rgba(255,255,255,0.08)' } },
          },
        },
      });
    }

    // 2. History table (bottom, newest first)
    const tbody = document.getElementById('history-table-body');
    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-zinc-500">No historical records yet. Send data via POST /vitals to populate.</td></tr>`;
      return;
    }

    const decimals = ['spo2', 'temp', 'resp'].includes(metricKey) ? 1 : 0;
    tbody.innerHTML = [...data].reverse().map(r => {
      const val = Number(r[metricKey]);
      const st = evaluateStatus(metricKey, val, r.activity);
      return `
        <tr class="hover:bg-white/5 transition">
          <td class="py-3 px-4 font-mono text-xs text-zinc-400">${esc(new Date(r.timestamp).toLocaleTimeString())}</td>
          <td class="py-3 px-4 uppercase text-xs font-semibold text-zinc-300">${esc(r.activity)}</td>
          <td class="py-3 px-4 font-bold text-white">${Number.isFinite(val) ? val.toFixed(decimals) : '-'}
            <span class="text-xs font-normal text-zinc-400">${esc(unit)}</span></td>
          <td class="py-3 px-4">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold border ${st.badge}">${st.level}</span>
          </td>
        </tr>`;
    }).join('');
  } catch (err) {
    console.error('Failed to load metric history:', err);
  }
}
  </script>
</body>
</html>
