<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Astronaut Health Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.1/dist/htmx.min.js" integrity="sha384-Qp9rdC8H7EqOoX+nR0P3RPG2Noji+qdwJlGpfzwQJsfOpp3sGwIdSP9xO3+UlEhn" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vitals.css">
  <link rel="stylesheet" href="alert-log.css">
  <link rel="stylesheet" href="alerts.css">
  <link rel="stylesheet" href="insight.css">
    
</head>
<body  class="dashboard-bg">

  <div class="page">
    <header class="page-header">
      <div>
        <p class="page-eyebrow">Simulated Telemetry</p>
        <h1 class="page-title">Crew Health Summary</h1>
      </div>
      <div class="live-badge">
        <span class="live-dot"></span>
        <span>Live Stream (3s Interval)</span>
      </div>
    </header>

    <div class="layout">
      <main class="layout-main">
        <!-- Must stay a sibling BEFORE #alerts-section, outside the polled area -->
        <input type="checkbox" id="alerts-open" class="alerts-toggle" aria-hidden="true" tabindex="-1">

        <section id="alerts-section"
                 hx-get="/partials/alerts"
          hx-trigger="load, every 3s"
	  hx-sync="this:drop"
                 hx-swap="innerMorph">
          <div class="metric-card placeholder">Loading health alerts...</div>
        </section>

        <section id="vitals-section"
                 hx-get="/partials/vitals"
                 hx-trigger="load, every 3s"
                 hx-swap="innerMorph">
          <div class="metric-card placeholder">Loading vital signs telemetry...</div>
        </section>
	
	<section id="insight-bar" class="metric-card insight-bar">
          <div class="insight-controls">
            <select name="astronaut_id" class="insight-select"
                    hx-get="/partials/astronaut-options"
                    hx-trigger="load"
                    hx-swap="innerHTML">
              <option value="">Loading crew...</option>
            </select>

            <button type="button" class="btn-insight"
                    hx-post="/partials/insight"
                    hx-include="#insight-bar [name='astronaut_id']"
                    hx-target="#insight-output"
                    hx-swap="innerHTML"
                    hx-disabled-elt="this">
              Analyze
            </button>
          </div>

          <div id="insight-output" class="insight-output"></div>
        </section>
      </main>

      <aside class="layout-aside">
        <div class="metric-card log-panel">
          <div class="log-panel-title">Alert Log</div>
          <div id="alert-log"
               class="log-panel-body"
               hx-get="/partials/alert-log"
               hx-trigger="load, every 3s"
               hx-swap="innerMorph">
            <p class="log-empty">Loading log...</p>
          </div>
        </div>	
      </aside>
    </div>
  </div>


  <!-- Metric detail modal: the server fills #modal-content -->
  <dialog id="metric-modal" class="metric-card modal-card">
    <button class="modal-close" data-close-modal aria-label="Close">✕</button>
    <div id="modal-content"></div>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
