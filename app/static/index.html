<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>NASA Astronaut Health Monitoring Dashboard</title>
  
  <!-- Load HTMX (for auto-refreshing the dashboard) -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <!-- Load Tailwind CSS (for layout and styling) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Load custom stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 p-6">

  <header class="flex justify-between items-center border-b border-slate-800 pb-4 mb-6">
    <h1 class="text-2xl font-bold text-sky-400">
      NASA-STD-3001 Crew Vital Signs Monitor
    </h1>
    <select name="astronaut_id"
            hx-get="/partials/vitals"
            hx-target="#dashboard"
            hx-trigger="change"
            class="bg-slate-900 border border-slate-700 rounded px-3 py-2">
      <option value="ASTRO-01">ASTRO-01 (EVA)</option>
      <option value="ASTRO-02">ASTRO-02 (Rest)</option>
    </select>
  </header>

  <!-- Content here will be automatically replaced by the FastAPI backend -->
  <main id="dashboard"
        hx-get="/partials/vitals"
        hx-trigger="load, every 3s"
        hx-swap="innerHTML">
        <p class="text-slate-400">Waiting for backend data connection...</p>
  </main>
  
</body>
</html>
